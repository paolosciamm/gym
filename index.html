<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Gym Tracker</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#0f1115;--card:#171a21;--card2:#1e222b;--text:#e8eaf0;--muted:#9aa3b2;
    --accent:#4f8cff;--accent2:#ff9f43;--ok:#3ddc84;--danger:#ff5c5c;--border:#2a2f3a;--radius:12px;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f4f5f8;--card:#ffffff;--card2:#eef1f6;--text:#1a1d25;--muted:#5d6675;--border:#d9dee7}
  }
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px 0}
  header .brand{display:flex;justify-content:space-between;align-items:baseline;max-width:860px;margin:0 auto 6px}
  header h1{margin:0;font-size:1.15rem}
  header .brand span{font-size:.75rem;color:var(--muted)}
  @media (max-width:600px){header .brand span{display:none}}
  .tabs{display:flex;gap:2px;max-width:860px;margin:0 auto}
  .tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:9px 6px;font-size:.92rem;font-weight:600;cursor:pointer;white-space:nowrap}
  .tabs button.active{color:var(--text);border-color:var(--accent)}
  main{max-width:860px;margin:0 auto;padding:14px 16px 96px}
  h3{margin:0 0 8px;font-size:1rem}
  p{margin:6px 0}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .muted{color:var(--muted)} .small{font-size:.85rem}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .seg button{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px 13px;border-radius:999px;cursor:pointer;font-size:.9rem;font-weight:600}
  .seg button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .badge{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.3px;vertical-align:middle;flex:none}
  .badge.M1{background:#2b4a8a;color:#cfe0ff}
  .badge.M2{background:#7a4b1f;color:#ffe3c7}
  .badge.CL{background:#2f5a3f;color:#c9f5d9}
  .ex-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .ex-head strong{font-size:1rem}
  .scheme{margin-left:auto;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
  .note{font-size:.85rem;color:var(--accent2);margin:2px 0 8px}
  .hint{font-size:.8rem;color:var(--muted);margin-top:8px}
  .sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
  .set label{display:block;font-size:.72rem;color:var(--muted);text-align:center;margin-bottom:3px;white-space:nowrap}
  .set input{width:100%;padding:10px 4px;text-align:center;font-size:1.05rem}
  input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;max-width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  textarea{width:100%;resize:vertical}
  label.field{display:block;font-size:.85rem;color:var(--muted);margin-bottom:10px}
  label.field > input, label.field > select{display:block;margin-top:4px;width:100%}
  label.check{display:flex;align-items:center;gap:8px;cursor:pointer}
  label.check input{width:22px;height:22px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:480px){.grid2{grid-template-columns:1fr}}
  .btn{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:9px;cursor:pointer;font:inherit;font-weight:600}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--danger);border-color:var(--danger)}
  .btn.link{background:none;border:0;padding:0 4px;color:var(--accent);text-decoration:underline}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
  .banner{background:var(--card2);border-left:4px solid var(--accent2);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:.9rem}
  .savebar{position:fixed;bottom:0;left:0;right:0;z-index:9;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px;justify-content:center}
  .savebar .btn{flex:1;max-width:280px;padding:12px}
  .blocks{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .block{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.92rem}
  .block:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .block .bi{width:24px;height:24px;border-radius:50%;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
  .block .muted{font-size:.8rem;font-variant-numeric:tabular-nums}
  details.session summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  details.session summary::-webkit-details-marker{display:none}
  .tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);margin-left:8px;vertical-align:middle}
  table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:10px}
  td,th{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.3px}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .range-nav{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
  .range-label{font-weight:600;min-width:170px;text-align:center}
  .chart-wrap{position:relative;margin-top:6px}
  .chart{display:block;width:100%;touch-action:pan-y}
  .chart .grid{stroke:var(--border);stroke-width:1}
  .chart .axis{fill:var(--muted);font-size:11px}
  .chart .empty{fill:var(--muted);font-size:13px}
  .tooltip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:.78rem;white-space:nowrap;display:none;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:3}
  .legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:4px}
  .legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
  .legend i.dashed{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)}
  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  [hidden]{display:none !important}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>🏋️ Gym Tracker</h1><span>dati salvati solo in questo browser · esporta il JSON</span></div>
  <nav class="tabs">
    <button data-view="workout">Allenamento</button>
    <button data-view="history">Storico</button>
    <button data-view="charts">Grafici</button>
    <button data-view="data">Dati</button>
  </nav>
</header>
<main>
  <section id="view-workout"></section>
  <section id="view-history" hidden></section>
  <section id="view-charts" hidden></section>
  <section id="view-data" hidden></section>
</main>
<div id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* =========================================================
   SCHEDE DI ALLENAMENTO
   kind: 'M1' = macchina (kg), 'M2' = manubri (kg), '' = corpo libero
   reps: ripetizioni per ogni serie (una voce = una serie)
   defaults: kg di esempio con cui precompilare la prima volta
   ========================================================= */
const SCHEDE = [
  { id: 'parte_alta', name: 'Parte alta', type: 'weights', exercises: [
    { id: 'vt1',            name: 'Vertical traction #1', kind: 'M1', reps: [10,10,10] },
    { id: 'vt2',            name: 'Vertical traction #2', kind: 'M1', reps: [10,10,10] },
    { id: 'rowing',         name: 'Rowing',               kind: 'M1', reps: [8,8,8,10,10], scheme: '3x8 + 2x10' },
    { id: 'chest_incline',  name: 'Chest incline',        kind: 'M1', reps: [10,10,10,10] },
    { id: 'chest_press',    name: 'Chest press',          kind: 'M1', reps: [10,10,10,10] },
    { id: 'pec_deck',       name: 'Pec Deck',             kind: 'M1', reps: [10,10,10,10] },
    { id: 'rear_delt',      name: 'Rear delt',            kind: 'M1', reps: [8,8,8,8] },
    { id: 'deltoid',        name: 'Deltoid',              kind: 'M1', reps: [10,10,10,10] },
    { id: 'bicipiti',       name: 'Bicipiti – Manubri',   kind: 'M2', reps: [10,10,10] },
    { id: 'tricipiti',      name: 'Tricipiti – Manubri',  kind: 'M2', reps: [10,10,10] },
    { id: 'tricipiti_cavi', name: 'Tricipiti ai cavi con impugnatura a triangolo', kind: 'M1', reps: [12,12,12] },
  ]},
  { id: 'gambe', name: 'Gambe', type: 'weights', exercises: [
    { id: 'leg',      name: 'Leg',      kind: 'M1', reps: [6,8,10,12], defaults: [50,55,60], note: '50-55-60 kg' },
    { id: 'pressa',   name: 'Pressa',   kind: 'M1', reps: [10,10,10,10], defaults: [90,90,90,90], note: '90 kg (non ancora comodo)' },
    { id: 'flessore', name: 'Flessore', kind: 'M1', reps: [10,10,10,10], defaults: [20,25,30], note: '20-25-30 kg' },
    { id: 'interno',  name: 'Interno',  kind: 'M1', reps: [8,8,8,8], defaults: [30,35,35,40], note: 'Intenso · 30-35-35-40 kg' },
    { id: 'esterno',  name: 'Esterno',  kind: 'M1', reps: [10,10,10,10], defaults: [25,null,null,40], note: '25-40 kg' },
    { id: 'glutei',   name: 'Glutei',   kind: 'M1', reps: [10,10,10,10], defaults: [15,25,45,45], note: '15-25-45-45 kg' },
    { id: 'polpacci', name: 'Polpacci', kind: 'M1', reps: [10,10,10,10], defaults: [15,20,20,25], note: '15-20-20-25 kg' },
  ]},
  { id: 'stretching', name: 'Stretching', type: 'weights', exercises: [
    { id: 'gatto_mucca',   name: 'Gatto/Mucca',            kind: '', reps: [10,10,10] },
    { id: 'superman',      name: 'Superman gamba/braccio', kind: '', reps: [10,10,10] },
    { id: 'ponte_doppio',  name: 'Ponte doppio',           kind: '', reps: [10,10], note: '+ isometria' },
    { id: 'ponte_mono',    name: 'Ponte monopodalico',     kind: '', reps: [10,10], note: '+ isometria' },
    { id: 'plank',         name: 'Plank sui gomiti',       kind: '', reps: ['1 min','1 min','1 min'], scheme: '3 x 1 min' },
    { id: 'plank_lat',     name: 'Plank laterale',         kind: '', reps: [], scheme: '+ 5 sollevamenti gamba' },
    { id: 'vt_spalle',     name: 'Vertical traction',      kind: 'M1', reps: [10,10,10], note: 'Busto staccato dal sedile per enfatizzare il lavoro sulle spalle' },
    { id: 'rear_delt_iso', name: 'Rear delt',              kind: 'M1', reps: [10,10,10], note: '+ isometria' },
    { id: 'farfalla',      name: 'Pesi farfalla',          kind: 'M2', reps: [10,10,10] },
  ]},
  { id: 'tempo_run', name: 'Tempo Run', type: 'run', blocks: [
    { run: 1000, extra: '10 salti' },
    { run: 800,  extra: '15 salti' },
    { run: 600,  extra: '20 salti' },
    { run: 400,  extra: '25 salti' },
    { run: 200,  extra: '30 salti' },
    { run: 200,  extra: '15+15 step up' },
    { run: 400,  extra: '12+12 step up' },
    { run: 600,  extra: '10+10 step up' },
    { run: 800,  extra: '8+8 step up' },
    { run: 1000, extra: '5+5 step up' },
  ]},
];

const WINDOWS = [
  { id: '7d', label: '7 giorni', days: 7 },
  { id: '1m', label: '1 mese',   days: 30 },
  { id: '3m', label: '3 mesi',   days: 91 },
  { id: '6m', label: '6 mesi',   days: 182 },
  { id: '1y', label: '1 anno',   days: 365 },
];

const STORAGE_KEY = 'gymTracker.v1';
const DRAFT_KEY = 'gymTracker.draft.v1';
const DAY = 86400000;

/* ---------------- utils ---------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'for') el.htmlFor = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k in el) el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
function svgEl(tag, attrs = {}, text) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const pad = n => String(n).padStart(2, '0');
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseDate = s => { const d = new Date(s); return isNaN(d) ? null : d; };
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const endOfDay = d => { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtDateTime = new Intl.DateTimeFormat('it-IT', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const fmtDay = new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'short' });
const fmtDayYear = new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtWeekday = new Intl.DateTimeFormat('it-IT', { weekday: 'short', day: 'numeric' });
const fmtMonth = new Intl.DateTimeFormat('it-IT', { month: 'short', year: '2-digit' });
const fmtDT = d => d ? fmtDateTime.format(d) : '?';
const fmtKg = v => (v == null || v === '') ? '–' : String(v).replace('.', ',');
const inputKg = v => (v == null || v === '') ? '' : String(v).replace('.', ',');
const round1 = v => Math.round(v * 10) / 10;
const numOrNull = v => { if (v === '' || v == null) return null; const n = Number(String(v).trim().replace(',', '.')); return Number.isFinite(n) ? n : null; };
const schedaById = id => SCHEDE.find(s => s.id === id);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ---------------- storage ---------------- */
function loadDb() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const p = JSON.parse(raw); if (Array.isArray(p.sessions)) return { version: 1, sessions: p.sessions }; }
  } catch (e) { console.warn('localStorage non leggibile', e); }
  return { version: 1, sessions: [] };
}
function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
  catch (e) { toast('Attenzione: impossibile salvare nel browser'); }
}
function loadDrafts() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); } catch { return {}; } }
function saveDraft(schedaId, data) { const d = loadDrafts(); d[schedaId] = data; try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch {} }
function clearDraft(schedaId) { const d = loadDrafts(); delete d[schedaId]; try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch {} }

/* ---------------- session helpers ---------------- */
function sortedSessions() { return [...db.sessions].sort((a, b) => String(b.date).localeCompare(String(a.date))); }
function lastSessionFor(schedaId, excludeId) { return sortedSessions().find(s => s.scheda === schedaId && s.id !== excludeId) || null; }
function schemeText(ex) {
  if (ex.scheme) return ex.scheme;
  const r = ex.reps; if (!r.length) return '';
  return r.every(x => x === r[0]) ? `${r.length}x${r[0]}` : r.join('-');
}
function kindLabel(k) { return k === 'M1' ? 'Macchina' : k === 'M2' ? 'Manubri' : 'Corpo libero'; }
function runProgress(run) {
  const blocks = schedaById('tempo_run').blocks;
  if (run == null || run.block == null || !blocks[run.block]) return 0;
  const before = blocks.slice(0, run.block).reduce((a, b) => a + b.run, 0);
  return before + Math.min(run.meters ?? 0, blocks[run.block].run);
}
const CIRCUIT_TOTAL = SCHEDE.find(s => s.id === 'tempo_run').blocks.reduce((a, b) => a + b.run, 0);
function runLabel(run) {
  const b = schedaById('tempo_run').blocks[run.block];
  if (!b) return 'blocco non indicato';
  return `Blocco ${run.block + 1} (${b.run} m + ${b.extra}) · ${run.meters ?? '–'} m nel blocco · totale ${runProgress(run)} m · ${run.minutes ?? '–'} min`;
}
function normalizeSession(raw) {
  if (!raw || typeof raw !== 'object' || typeof raw.scheda !== 'string' || !parseDate(raw.date)) return null;
  const s = { id: typeof raw.id === 'string' ? raw.id : uid(), scheda: raw.scheda, date: raw.date,
    createdAt: raw.createdAt || new Date().toISOString(), updatedAt: raw.updatedAt || raw.createdAt || new Date().toISOString(),
    notes: typeof raw.notes === 'string' ? raw.notes : '' };
  if (raw.exercises && typeof raw.exercises === 'object') s.exercises = raw.exercises;
  if (raw.run && typeof raw.run === 'object') s.run = { block: raw.run.block ?? null, meters: numOrNull(raw.run.meters), minutes: numOrNull(raw.run.minutes) };
  return s;
}

/* ---------------- state ---------------- */
let db = loadDb();
const ui = {
  view: 'workout', scheda: SCHEDE[0].id, editingId: null, histFilter: 'all',
  chart: { win: '7d', end: new Date(), scheda: SCHEDE[0].id, ex: null },
};

function render() {
  $$('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === ui.view));
  for (const v of ['workout', 'history', 'charts', 'data']) $('#view-' + v).hidden = ui.view !== v;
  ({ workout: renderWorkout, history: renderHistory, charts: renderCharts, data: renderData })[ui.view]();
  window.scrollTo(0, 0);
}

/* =========================================================
   ALLENAMENTO
   ========================================================= */
function renderWorkout() {
  const root = $('#view-workout'); root.replaceChildren();
  const scheda = schedaById(ui.scheda);
  const editing = ui.editingId ? db.sessions.find(s => s.id === ui.editingId) : null;
  if (ui.editingId && !editing) ui.editingId = null;
  const draft = editing ? null : loadDrafts()[scheda.id];
  const last = lastSessionFor(scheda.id, ui.editingId);

  root.append(h('div', { class: 'seg' }, SCHEDE.map(s => h('button', {
    class: s.id === ui.scheda ? 'active' : '',
    onClick: () => {
      if (ui.editingId && !confirm('Stai modificando una sessione: cambiando scheda la modifica viene annullata. Continuare?')) return;
      ui.editingId = null; ui.scheda = s.id; renderWorkout();
    },
  }, s.name))));

  if (editing) {
    root.append(h('div', { class: 'banner' }, `✏️ Stai modificando la sessione del ${fmtDT(parseDate(editing.date))}. `,
      h('button', { class: 'btn link', onClick: () => { ui.editingId = null; renderWorkout(); } }, 'Annulla modifica')));
  } else if (draft) {
    root.append(h('div', { class: 'banner' }, '💾 Bozza ripristinata (non ancora salvata). ',
      h('button', { class: 'btn link', onClick: () => { clearDraft(scheda.id); renderWorkout(); } }, 'Azzera')));
  }

  const dateCard = h('div', { class: 'card' },
    h('label', { class: 'field', for: 'session-date' }, 'Data e ora della sessione',
      h('input', { type: 'datetime-local', id: 'session-date', value: editing ? editing.date : toLocalInput(new Date()) })),
    last ? h('div', { class: 'hint', style: 'margin-top:0' }, `Ultima sessione "${scheda.name}": ${fmtDT(parseDate(last.date))}`)
         : h('div', { class: 'hint', style: 'margin-top:0' }, `Nessuna sessione "${scheda.name}" salvata finora`));
  root.append(dateCard);

  if (scheda.type === 'weights') {
    for (const ex of scheda.exercises) {
      const saved = editing?.exercises?.[ex.id] || draft?.exercises?.[ex.id] || null;
      const lastEx = last?.exercises?.[ex.id] || null;
      const card = h('div', { class: 'card ex' });
      card.append(h('div', { class: 'ex-head' },
        h('span', { class: 'badge ' + (ex.kind || 'CL'), title: kindLabel(ex.kind) }, ex.kind || 'CL'),
        h('strong', {}, ex.name),
        h('span', { class: 'scheme' }, schemeText(ex))));
      if (ex.note) card.append(h('div', { class: 'note' }, '📝 ' + ex.note));
      if (ex.kind) {
        const prefill = saved?.kg || lastEx?.kg || ex.defaults || [];
        card.append(h('div', { class: 'sets' }, ex.reps.map((rep, i) => h('div', { class: 'set' },
          h('label', {}, `S${i + 1} · ${rep}`),
          h('input', { type: 'text', inputMode: 'decimal', placeholder: 'kg', value: inputKg(prefill[i]), dataset: { ex: ex.id, set: i }, onInput: onFormInput })))));
        if (lastEx?.kg?.some(v => v != null)) {
          card.append(h('div', { class: 'hint' }, `Ultima volta (${fmtDay.format(parseDate(last.date))}): ${lastEx.kg.map(fmtKg).join(' · ')} kg`));
        }
      } else {
        card.append(h('label', { class: 'check' },
          h('input', { type: 'checkbox', checked: !!saved?.done, dataset: { exDone: ex.id }, onChange: onFormInput }), 'Fatto'));
      }
      root.append(card);
    }
  } else {
    const saved = editing?.run || draft?.run || null;
    const card = h('div', { class: 'card' }, h('h3', {}, 'Blocco del circuito raggiunto'));
    const list = h('div', { class: 'blocks' });
    let cum = 0;
    scheda.blocks.forEach((b, i) => {
      const from = cum; cum += b.run;
      list.append(h('label', { class: 'block' },
        h('input', { type: 'radio', name: 'run-block', value: i, checked: saved?.block === i, onChange: () => { updateRunSummary(); onFormInput(); } }),
        h('span', { class: 'bi' }, i + 1),
        h('span', {}, `${b.run} m + ${b.extra}`),
        h('span', { class: 'muted' }, `${from}–${cum} m`)));
    });
    card.append(list);
    card.append(h('div', { class: 'grid2' },
      h('label', { class: 'field' }, 'Metri percorsi nel blocco raggiunto',
        h('input', { type: 'text', inputMode: 'numeric', id: 'run-meters', placeholder: 'es. 560', value: saved?.meters ?? '', onInput: () => { updateRunSummary(); onFormInput(); } })),
      h('label', { class: 'field' }, 'Tempo totale workout (minuti)',
        h('input', { type: 'text', inputMode: 'decimal', id: 'run-minutes', placeholder: 'es. 43', value: saved?.minutes ?? '', onInput: onFormInput }))));
    card.append(h('div', { class: 'hint', id: 'run-summary' }));
    if (last?.run) card.append(h('div', { class: 'hint' }, `Ultima volta (${fmtDay.format(parseDate(last.date))}): ${runLabel(last.run)}`));
    root.append(card);
    setTimeout(updateRunSummary, 0);
  }

  root.append(h('div', { class: 'card' }, h('label', { class: 'field' }, 'Note della sessione',
    h('textarea', { id: 'session-notes', rows: 2, placeholder: 'Come è andata, dolori, sensazioni…', value: editing?.notes || draft?.notes || '', onInput: onFormInput }))));

  root.append(h('div', { class: 'savebar' },
    h('button', { class: 'btn primary', onClick: saveSession }, editing ? 'Aggiorna sessione' : 'Salva sessione'),
    editing
      ? h('button', { class: 'btn', onClick: () => { ui.editingId = null; renderWorkout(); } }, 'Annulla')
      : h('button', { class: 'btn', onClick: () => { if (confirm('Azzerare i campi inseriti?')) { clearDraft(scheda.id); renderWorkout(); } } }, 'Azzera')));
}

function updateRunSummary() {
  const el = $('#run-summary'); if (!el) return;
  const r = $('input[name="run-block"]:checked');
  if (!r) { el.textContent = 'Seleziona il blocco in cui ti sei fermato.'; return; }
  const run = { block: Number(r.value), meters: numOrNull($('#run-meters').value) ?? 0 };
  el.textContent = `Totale percorso nel circuito: ${runProgress(run)} m su ${CIRCUIT_TOTAL} m`;
}

function collectForm() {
  const scheda = schedaById(ui.scheda);
  const s = { scheda: scheda.id, date: $('#session-date').value, notes: $('#session-notes').value.trim() };
  if (scheda.type === 'weights') {
    s.exercises = {};
    for (const ex of scheda.exercises) {
      if (ex.kind) {
        const kg = ex.reps.map((_, i) => numOrNull($(`input[data-ex="${ex.id}"][data-set="${i}"]`).value));
        if (kg.some(v => v != null)) s.exercises[ex.id] = { kg };
      } else if ($(`input[data-ex-done="${ex.id}"]`).checked) {
        s.exercises[ex.id] = { done: true };
      }
    }
  } else {
    const r = $('input[name="run-block"]:checked');
    s.run = { block: r ? Number(r.value) : null, meters: numOrNull($('#run-meters').value), minutes: numOrNull($('#run-minutes').value) };
  }
  return s;
}

function onFormInput() {
  if (ui.editingId) return;
  const d = collectForm(); delete d.date;
  saveDraft(ui.scheda, d);
}

function saveSession() {
  const data = collectForm();
  if (!parseDate(data.date)) { toast('Inserisci una data valida'); $('#session-date').focus(); return; }
  if (data.run && data.run.block == null) { toast('Seleziona il blocco raggiunto'); return; }
  const now = new Date().toISOString();
  if (ui.editingId) {
    const idx = db.sessions.findIndex(s => s.id === ui.editingId);
    db.sessions[idx] = { ...db.sessions[idx], ...data, updatedAt: now };
    toast('Sessione aggiornata');
  } else {
    db.sessions.push({ id: uid(), createdAt: now, updatedAt: now, ...data });
    toast('Sessione salvata · ricorda di esportare il JSON');
  }
  persist(); clearDraft(data.scheda);
  ui.editingId = null; ui.histFilter = 'all'; ui.view = 'history'; render();
}

function sessionSummary(s) {
  if (s.run) return runLabel(s.run);
  const scheda = schedaById(s.scheda);
  const parts = [];
  for (const ex of scheda?.exercises || []) {
    const e = s.exercises?.[ex.id]; if (!e) continue;
    if (e.kg) parts.push(`${ex.name} ${e.kg.map(fmtKg).join('/')}`);
    else if (e.done) parts.push(`${ex.name} ✓`);
  }
  return parts.length ? parts.join(' · ') : 'nessun dato inserito';
}

/* =========================================================
   GRAFICI
   ========================================================= */
function niceTicks(min, max, n = 5) {
  const span = (max - min) || 1;
  const raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return { ticks, lo, hi: hi > lo ? hi : lo + step };
}
function xTicks(start, end) {
  const days = Math.round((end - start) / DAY);
  const out = [];
  if (days <= 15) {
    for (let d = startOfDay(start); d <= end; d = addDays(d, 1)) out.push({ t: d.getTime() + DAY / 2, grid: d.getTime(), label: fmtWeekday.format(d) });
  } else if (days <= 120) {
    const step = days <= 35 ? 7 : 14;
    for (let d = startOfDay(start); d <= end; d = addDays(d, step)) out.push({ t: d.getTime(), grid: d.getTime(), label: fmtDay.format(d) });
  } else {
    let i = 0;
    for (let d = new Date(start.getFullYear(), start.getMonth() + 1, 1); d <= end; d = new Date(d.getFullYear(), d.getMonth() + 1, 1), i++) {
      out.push({ t: d.getTime(), grid: d.getTime(), label: (days > 200 && i % 2) ? '' : fmtMonth.format(d) });
    }
  }
  return out;
}

/** series: [{name,color,dashed,points:[{x:Date,y:number,lines:[string]}]}] */
function lineChart({ start, end, series, yFmt = v => String(v), yMax }) {
  const wrap = h('div', { class: 'chart-wrap' });
  const tip = h('div', { class: 'tooltip' });
  const W = Math.max(300, ($('#view-charts').clientWidth || 600) - 30);
  const H = 240, pad = { l: 46, r: 16, t: 14, b: 30 };
  const xs = start.getTime(), xe = end.getTime();
  const allY = series.flatMap(s => s.points.map(p => p.y));
  let hi = allY.length ? Math.max(...allY, yMax ?? 0) : (yMax ?? 10);
  if (hi <= 0) hi = 10;
  const t = niceTicks(0, hi, 5);
  const X = ms => pad.l + (ms - xs) / (xe - xs) * (W - pad.l - pad.r);
  const Y = v => pad.t + (t.hi - v) / (t.hi - t.lo) * (H - pad.t - pad.b);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', height: H });

  for (const v of t.ticks) {
    svg.append(svgEl('line', { x1: pad.l, x2: W - pad.r, y1: Y(v), y2: Y(v), class: 'grid' }));
    svg.append(svgEl('text', { x: pad.l - 6, y: Y(v) + 4, class: 'axis', 'text-anchor': 'end' }, yFmt(v)));
  }
  for (const tk of xTicks(start, end)) {
    svg.append(svgEl('line', { x1: X(tk.grid), x2: X(tk.grid), y1: pad.t, y2: H - pad.b, class: 'grid' }));
    if (tk.label) svg.append(svgEl('text', { x: X(tk.t), y: H - 9, class: 'axis', 'text-anchor': 'middle' }, tk.label));
  }
  const dots = [];
  for (const s of series) {
    if (s.points.length > 1) {
      const d = s.points.map((p, i) => (i ? 'L' : 'M') + X(p.x.getTime()).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
      svg.append(svgEl('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 2.2, 'stroke-linejoin': 'round', 'stroke-dasharray': s.dashed ? '5 4' : null }));
    }
    for (const p of s.points) {
      const c = svgEl('circle', { cx: X(p.x.getTime()), cy: Y(p.y), r: 4, fill: s.color });
      svg.append(c); dots.push({ c, p, s });
    }
  }
  if (!allY.length) svg.append(svgEl('text', { x: W / 2, y: H / 2, class: 'empty', 'text-anchor': 'middle' }, 'Nessun dato nella finestra selezionata'));

  const hide = () => { tip.style.display = 'none'; dots.forEach(d => d.c.setAttribute('r', 4)); };
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect();
    const mx = (e.clientX - r.left) * W / r.width, my = (e.clientY - r.top) * H / r.height;
    let best = null, bd = Infinity;
    for (const d of dots) {
      const dist = Math.hypot(X(d.p.x.getTime()) - mx, (Y(d.p.y) - my) * 0.5);
      if (dist < bd) { bd = dist; best = d; }
    }
    if (!best || bd > 60) { hide(); return; }
    tip.replaceChildren(h('div', {}, h('strong', { style: 'color:' + best.s.color }, best.s.name)), ...best.p.lines.map(l => h('div', {}, l)));
    tip.style.display = 'block';
    const cx = X(best.p.x.getTime()) * r.width / W, cy = Y(best.p.y) * r.height / H;
    tip.style.left = Math.max(0, Math.min(cx - tip.offsetWidth / 2, r.width - tip.offsetWidth)) + 'px';
    tip.style.top = (cy - tip.offsetHeight - 12 < 0 ? cy + 12 : cy - tip.offsetHeight - 12) + 'px';
    dots.forEach(d => d.c.setAttribute('r', d === best ? 6.5 : 4));
  });
  svg.addEventListener('pointerleave', hide);
  wrap.append(svg, tip);
  return wrap;
}
function legend(items) {
  return h('div', { class: 'legend' }, items.map(i => h('span', {}, h('i', { class: i.dashed ? 'dashed' : '', style: `color:${i.color};background:${i.dashed ? '' : i.color}` }), i.name)));
}

function renderCharts() {
  const root = $('#view-charts'); root.replaceChildren();
  const c = ui.chart;
  const win = WINDOWS.find(w => w.id === c.win);
  const end = endOfDay(c.end);
  const start = startOfDay(addDays(end, -(win.days - 1)));
  const isToday = endOfDay(c.end).getTime() >= endOfDay(new Date()).getTime();

  root.append(h('div', { class: 'card' },
    h('div', { class: 'seg' }, WINDOWS.map(w => h('button', { class: w.id === c.win ? 'active' : '', onClick: () => { c.win = w.id; renderCharts(); } }, w.label))),
    h('div', { class: 'range-nav' },
      h('button', { class: 'btn', title: 'Periodo precedente', onClick: () => { c.end = addDays(c.end, -win.days); renderCharts(); } }, '◀'),
      h('span', { class: 'range-label' }, `${fmtDay.format(start)} – ${fmtDayYear.format(end)}`),
      h('button', { class: 'btn', title: 'Periodo successivo', disabled: isToday, onClick: () => { c.end = addDays(c.end, win.days); if (c.end > new Date()) c.end = new Date(); renderCharts(); } }, '▶'),
      h('button', { class: 'btn', disabled: isToday, onClick: () => { c.end = new Date(); renderCharts(); } }, 'Oggi'))));

  root.append(h('div', { class: 'seg' }, SCHEDE.map(s => h('button', { class: s.id === c.scheda ? 'active' : '', onClick: () => { c.scheda = s.id; c.ex = null; renderCharts(); } }, s.name))));

  const scheda = schedaById(c.scheda);
  const inWin = db.sessions.filter(s => s.scheda === scheda.id)
    .map(s => ({ s, d: parseDate(s.date) }))
    .filter(x => x.d && x.d >= start && x.d <= end)
    .sort((a, b) => a.d - b.d);

  if (scheda.type === 'weights') {
    const exs = scheda.exercises.filter(e => e.kind);
    if (!c.ex || !exs.some(e => e.id === c.ex)) {
      c.ex = (exs.find(e => db.sessions.some(s => s.scheda === scheda.id && s.exercises?.[e.id]?.kg)) || exs[0]).id;
    }
    const ex = exs.find(e => e.id === c.ex);
    const pts = inWin.filter(x => x.s.exercises?.[ex.id]?.kg?.some(v => v != null)).map(x => {
      const all = x.s.exercises[ex.id].kg; const kg = all.filter(v => v != null);
      return { d: x.d, all, max: Math.max(...kg), avg: round1(kg.reduce((a, b) => a + b, 0) / kg.length) };
    });
    const lines = p => [fmtDT(p.d), `Serie: ${p.all.map(fmtKg).join(' · ')} kg`, `Max ${fmtKg(p.max)} · Media ${fmtKg(p.avg)} kg`];
    const series = [
      { name: 'Max kg', color: '#4f8cff', points: pts.map(p => ({ x: p.d, y: p.max, lines: lines(p) })) },
      { name: 'Media kg', color: '#ff9f43', dashed: true, points: pts.map(p => ({ x: p.d, y: p.avg, lines: lines(p) })) },
    ];
    root.append(h('div', { class: 'card' },
      h('label', { class: 'field' }, 'Esercizio',
        h('select', { onChange: e => { c.ex = e.target.value; renderCharts(); } },
          exs.map(e => h('option', { value: e.id, selected: e.id === c.ex }, `${e.kind} · ${e.name}`)))),
      h('h3', {}, `${ex.name} – kg per sessione`),
      lineChart({ start, end, series, yFmt: v => v + ' kg' }),
      legend(series)));
    const tbl = h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Data'), h('th', {}, 'Serie (kg)'), h('th', {}, 'Max'), h('th', {}, 'Media'))),
      h('tbody', {}, pts.slice().reverse().map(p => h('tr', {}, h('td', {}, fmtDT(p.d)), h('td', { class: 'num' }, p.all.map(fmtKg).join(' · ')), h('td', { class: 'num' }, fmtKg(p.max)), h('td', { class: 'num' }, fmtKg(p.avg))))));
    root.append(h('div', { class: 'card' }, h('h3', {}, 'Dati nel periodo'), pts.length ? tbl : h('p', { class: 'muted small' }, 'Nessuna sessione con kg per questo esercizio nel periodo.')));
  } else {
    const pts = inWin.filter(x => x.s.run && x.s.run.block != null).map(x => ({ d: x.d, run: x.s.run, progress: runProgress(x.s.run) }));
    const lines = p => [fmtDT(p.d), runLabel(p.run)];
    const sTime = [{ name: 'Tempo totale', color: '#4f8cff', points: pts.filter(p => p.run.minutes != null).map(p => ({ x: p.d, y: p.run.minutes, lines: lines(p) })) }];
    const sProg = [{ name: 'Metri percorsi', color: '#3ddc84', points: pts.map(p => ({ x: p.d, y: p.progress, lines: lines(p) })) }];
    root.append(h('div', { class: 'card' }, h('h3', {}, 'Tempo totale del workout (minuti)'), lineChart({ start, end, series: sTime, yFmt: v => v + "'" }), legend(sTime)));
    root.append(h('div', { class: 'card' }, h('h3', {}, `Punto raggiunto nel circuito (metri percorsi, su ${CIRCUIT_TOTAL} m)`), lineChart({ start, end, series: sProg, yFmt: v => v + ' m', yMax: CIRCUIT_TOTAL }), legend(sProg)));
    const blocks = scheda.blocks;
    const tbl = h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Data'), h('th', {}, 'Blocco'), h('th', {}, 'Nel blocco'), h('th', {}, 'Totale'), h('th', {}, 'Tempo'))),
      h('tbody', {}, pts.slice().reverse().map(p => h('tr', {}, h('td', {}, fmtDT(p.d)),
        h('td', {}, `${p.run.block + 1} · ${blocks[p.run.block].run} m + ${blocks[p.run.block].extra}`),
        h('td', { class: 'num' }, `${p.run.meters ?? '–'} m`), h('td', { class: 'num' }, `${p.progress} m`), h('td', { class: 'num' }, p.run.minutes != null ? `${p.run.minutes} min` : '–')))));
    root.append(h('div', { class: 'card' }, h('h3', {}, 'Dati nel periodo'), pts.length ? tbl : h('p', { class: 'muted small' }, 'Nessuna sessione Tempo Run nel periodo.')));
  }
}

/* =========================================================
   DATI: EXPORT / IMPORT
   ========================================================= */
function exportPayload() {
  return { app: 'gym-tracker', version: 1, exportedAt: new Date().toISOString(), sessions: sortedSessions().reverse() };
}
function exportJson() {
  const blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `gym-tracker-${toLocalInput(new Date()).slice(0, 10)}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('JSON esportato');
}
async function copyJson() {
  const text = JSON.stringify(exportPayload(), null, 2);
  try { await navigator.clipboard.writeText(text); toast('JSON copiato negli appunti'); }
  catch { const ta = $('#json-paste'); ta.value = text; ta.select(); toast('Copia il testo dal riquadro qui sotto'); }
}
function importText(text, mode) {
  let parsed;
  try { parsed = JSON.parse(text); } catch { toast('JSON non valido'); return; }
  const arr = Array.isArray(parsed) ? parsed : parsed?.sessions;
  if (!Array.isArray(arr)) { toast('Formato non riconosciuto: manca "sessions"'); return; }
  const incoming = arr.map(normalizeSession).filter(Boolean);
  const invalid = arr.length - incoming.length;
  let added = 0, updated = 0, skipped = 0;
  if (mode === 'replace') {
    if (!confirm(`Sostituire le ${db.sessions.length} sessioni attuali con le ${incoming.length} del file?`)) return;
    db.sessions = incoming; added = incoming.length;
  } else {
    const byId = new Map(db.sessions.map(s => [s.id, s]));
    for (const s of incoming) {
      const cur = byId.get(s.id);
      if (!cur) { byId.set(s.id, s); added++; }
      else if (String(s.updatedAt) > String(cur.updatedAt)) { byId.set(s.id, s); updated++; }
      else skipped++;
    }
    db.sessions = [...byId.values()];
  }
  persist();
  toast(`Import: ${added} nuove, ${updated} aggiornate, ${skipped} invariate${invalid ? `, ${invalid} scartate` : ''}`);
  renderData();
}

function renderData() {
  const root = $('#view-data'); root.replaceChildren();
  const n = db.sessions.length, last = sortedSessions()[0];
  const perScheda = SCHEDE.map(s => `${s.name}: ${db.sessions.filter(x => x.scheda === s.id).length}`).join(' · ');
  root.append(h('div', { class: 'card' }, h('h3', {}, 'Stato'),
    h('p', {}, `${n} ${n === 1 ? 'sessione salvata' : 'sessioni salvate'} in questo browser.`),
    h('p', { class: 'muted small' }, perScheda),
    last ? h('p', { class: 'muted small' }, `Ultima sessione: ${fmtDT(parseDate(last.date))}`) : null,
    h('p', { class: 'muted small' }, 'Non c’è nessun database: lo storico vive nel localStorage del browser e nel JSON che esporti. Esporta dopo ogni allenamento e conserva il file (es. nel repository GitHub); su un altro dispositivo basta importarlo per ritrovare tutto.')));

  root.append(h('div', { class: 'card' }, h('h3', {}, 'Esporta'),
    h('p', { class: 'muted small' }, 'Scarica un file JSON con tutto lo storico. Lo stesso file può essere reimportato in seguito e unito ai dati presenti: ogni sessione ha un id univoco, quindi non si creano duplicati.'),
    h('div', { class: 'actions' }, h('button', { class: 'btn primary', onClick: exportJson }, '⬇ Scarica JSON'), h('button', { class: 'btn', onClick: copyJson }, 'Copia JSON'))));

  const mode = h('select', { id: 'import-mode' },
    h('option', { value: 'merge' }, 'Unisci allo storico esistente (consigliato)'),
    h('option', { value: 'replace' }, 'Sostituisci tutto lo storico'));
  const file = h('input', { type: 'file', accept: '.json,application/json', onChange: e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => importText(t, mode.value)).catch(() => toast('Errore nella lettura del file'));
    e.target.value = '';
  } });
  const ta = h('textarea', { id: 'json-paste', rows: 5, placeholder: '…oppure incolla qui il contenuto del JSON' });
  root.append(h('div', { class: 'card' }, h('h3', {}, 'Importa'),
    h('label', { class: 'field' }, 'Modalità', mode),
    h('label', { class: 'field' }, 'File JSON', file),
    ta,
    h('div', { class: 'actions' }, h('button', { class: 'btn', onClick: () => { if (!ta.value.trim()) { toast('Incolla prima il JSON'); return; } importText(ta.value, mode.value); } }, 'Importa dal testo'))));

  root.append(h('div', { class: 'card' }, h('h3', {}, 'Zona pericolosa'),
    h('button', { class: 'btn danger', onClick: () => {
      if (!confirm('Cancellare TUTTO lo storico da questo browser? Esporta prima il JSON se non l’hai fatto.')) return;
      if (!confirm('Confermi? L’operazione è irreversibile.')) return;
      db = { version: 1, sessions: [] }; persist(); localStorage.removeItem(DRAFT_KEY); toast('Storico cancellato'); renderData();
    } }, 'Cancella tutto lo storico')));
}

/* ---------------- boot ---------------- */
$$('.tabs button').forEach(b => b.addEventListener('click', () => { ui.view = b.dataset.view; render(); }));
window.addEventListener('resize', debounce(() => { if (ui.view === 'charts') renderCharts(); }, 200));
render();
})();
</script>
</body>
</html>
